services:
  forecast-api:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    environment:
      MODEL_VERSION: ${MODEL_VERSION}
    ports:
      - "${FORECAST_PORT:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  orders-api:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    ports:
      - "${ORDERS_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FORECAST_URL: http://forecast-api:8001
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT:-3.0}
    dns:
      - 8.8.8.8
      - 1.1.1.1